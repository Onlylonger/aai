
name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win

          - os: macos-latest
            platform: mac

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7.0.1

      - name: Install Node and NPM
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Package application
        run: |
          npm exec electron-builder -- --publish never --${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ github.sha }}
          path: release/build/
          if-no-files-found: error
          retention-days: 14
